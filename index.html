<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmileCare Dental Hospital | Advanced Dental Care. Gentle Treatment. Confident Smiles.</title>
    <meta name="description" content="Experience world-class dental care at SmileCare Dental Hospital. Routine checkups, painless root canals, dental implants, teeth whitening, orthodontics & pediatric dentistry in a modern, hygienic environment." />
    <meta name="theme-color" content="#0f2b48" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased text-slate-800 bg-[#fbfcfd] selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    
    <!-- Google Translate Script (Fail-Safe) -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            var targetEl = document.getElementById('google_translate_element');
            if (targetEl) {
              new window.google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,hi',
                layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false,
              }, 'google_translate_element');
            }
          }
        } catch (e) {
          console.warn('Google Translate error:', e);
        }
      };
    </script>
    <script type="text/javascript" async src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
